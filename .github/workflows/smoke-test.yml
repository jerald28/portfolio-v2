name: Screenshots (temporary)
on:
  push:
    branches: [ci-smoke-test]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm init -y >/dev/null && npm install --no-save playwright@1.48.2 sharp@0.33.5 && npx playwright install --with-deps chromium
      - run: node .ci/shots.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add shots
          git commit -m "Screenshots" && git push origin HEAD:ci-smoke-test
